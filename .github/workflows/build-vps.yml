name: Compilar versão da VPS

on:
  push:
    branches: [main]
    # Mudanças que não alteram o sistema compilado não precisam de nova compilação.
    # Mantenha esta lista igual a IGNORAR_BUILD em local-docker/atualizar.sh.
    paths-ignore:
      - "local-docker/**"
      - "**/*.md"
      - "drizzle/**"
      - "supabase/**"
      - "tests/**"
      - ".lovable/**"
      - "*.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-vps
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache de dependências
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Cache da compilação
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: vite-${{ runner.os }}-${{ github.sha }}
          restore-keys: vite-${{ runner.os }}-
      - name: Instalar dependências
        run: bun install --frozen-lockfile || bun install
      - name: Build (Node server)
        env:
          NITRO_PRESET: node-server
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run build
      - name: Empacotar
        run: |
          echo "${GITHUB_SHA}" > .output/VERSION
          tar -czf vps-build.tar.gz .output
      - name: Publicar pacote (release vps-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete vps-latest -y --cleanup-tag || true
          gh release create vps-latest vps-build.tar.gz --title "VPS build ${GITHUB_SHA::7}" --notes "${GITHUB_SHA}" --target "${GITHUB_SHA}"
