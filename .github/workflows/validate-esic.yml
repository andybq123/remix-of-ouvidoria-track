name: Validar aplicação e fluxo e-SIC

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-esic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências do lockfile
        run: bun install --frozen-lockfile
      - name: Verificar TypeScript
        run: ./node_modules/.bin/tsc --noEmit
      - name: Testes unitários e ingestão simulada
        run: ./node_modules/.bin/vitest run
      - name: Instalar PostgreSQL isolado para os testes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16
      - name: Testar migration, triagem, prorrogação e concorrência
        run: bash tests/esic/run.sh
      - name: Build no mesmo preset da VPS
        env:
          NITRO_PRESET: node-server
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run build
