name: Validar aplicação e fluxo e-SIC

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-esic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
      - name: Instalar dependências do lockfile
        run: bun install --frozen-lockfile
      - name: Verificar TypeScript
        run: ./node_modules/.bin/tsc --noEmit
      - name: Testes unitários e ingestão simulada
        run: ./node_modules/.bin/vitest run
      - name: Instalar PostgreSQL isolado para os testes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-16
      - name: Testar migration, triagem, prorrogação e concorrência
        run: bash tests/esic/run.sh
      - name: Testar limpeza restrita, rollback e importação
        run: bash tests/limpeza/run.sh
      - name: Testar instalação nova do banco (duas vezes), usuários e permissões
        run: bash tests/instalacao/run.sh
      - name: Validar sintaxe dos comandos do deploy
        run: for f in deploy.sh local-docker/deploy/*.sh local-docker/atualizar.sh local-docker/agente-atualizacao/*.sh; do bash -n "$f"; done && node --check local-docker/manutencao/conferir-banco.mjs && node --check local-docker/manutencao/conferir-retomada.mjs
      - name: Conferir migrations VPS e Supabase equivalentes
        run: cmp local-docker/atualizacoes-banco/006_esic_importacao_backup.sql local-docker/supabase/migrations/20261013160000_esic_importacao_backup.sql
      - name: Build no mesmo preset da VPS
        env:
          NITRO_PRESET: node-server
          NODE_OPTIONS: --max-old-space-size=6144
        run: bun run build
