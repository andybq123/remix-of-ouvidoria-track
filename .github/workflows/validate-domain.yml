name: Validar troca de domínio VPS
on:
  pull_request:
    branches: [main]
    paths:
      - alterar_dominio.sh
      - local-docker/manutencao/dominio-*.mjs
      - local-docker/corrigir-tamanhos.mjs
      - tests/dominio/**
      - .github/workflows/validate-domain.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-domain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  domain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar ferramentas de verificação
        run: sudo apt-get update -qq && sudo apt-get install -y -qq caddy shellcheck
      - name: Sintaxe e ShellCheck
        run: |
          bash -n alterar_dominio.sh
          shellcheck alterar_dominio.sh
          node --check local-docker/manutencao/dominio-config.mjs
          node --check local-docker/manutencao/dominio-auth.mjs
      - name: Configuração, proxy HTTP real e GoTrue simulado
        run: node --test tests/dominio/*.node.mjs
