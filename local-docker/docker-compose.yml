services:
  app:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ..:/app
      - app_node_modules:/app/node_modules
    env_file: .env.local
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install --no-audit --no-fund && npx vite dev --host 0.0.0.0 --port 8080"

volumes:
  app_node_modules:
