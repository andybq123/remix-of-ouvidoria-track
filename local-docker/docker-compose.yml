services:
  app:
    image: node:22-bookworm
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ..:/app
      - app_node_modules:/app/node_modules
    env_file: .env.local
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${APP_DOMAIN:-localhost}
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install --no-audit --no-fund && npx vite dev --host 0.0.0.0 --port 8080"

volumes:
  app_node_modules:
