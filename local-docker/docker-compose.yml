services:
  app:
    image: node:24.22.1-bookworm
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ..:/app
      - app_node_modules:/app/node_modules
    env_file: .env.local
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${APP_DOMAIN:-localhost}
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm i -g bun@1 && rm -f package-lock.json && bun install && npx vite dev --host 0.0.0.0 --port 8080"

  # Coleta automática de e-mails (Gmail) a cada 3 minutos
  coletor-email:
    image: curlimages/curl:latest
    restart: unless-stopped
    env_file: .env.local
    depends_on:
      - app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Coleta de e-mails a cada 3 minutos iniciada"
        while true; do
          sleep 180
          curl -s -m 170 -X POST -H "Authorization: Bearer $${CRON_SECRET}" http://app:8080/api/public/email-sync | head -c 300
          echo " [$$(date '+%d/%m %H:%M')]"
        done

  # Agente 1Doc: confere baixa/arquivamento das ouvidorias quando pedido no sistema
  agente-1doc:
    build:
      context: ./agente-1doc
    image: ouvidesk-agente-1doc:node24
    restart: unless-stopped
    env_file: .env.local
    working_dir: /agente
    volumes:
      - ./agente-1doc:/agente
      # Dependências da imagem prevalecem sobre instalações antigas do volume.
      - /agente/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: node agente.mjs

volumes:
  app_node_modules:
