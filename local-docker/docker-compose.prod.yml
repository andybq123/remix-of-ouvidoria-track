# Modo produção: compila o sistema uma vez e serve a versão otimizada.
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  app:
    environment:
      # Mais memória para a compilação (evita "JavaScript heap out of memory")
      NODE_OPTIONS: "--max-old-space-size=5120"
      # Compila para servidor Node.js (em vez de Cloudflare)
      NITRO_PRESET: "node-server"
      HOST: "0.0.0.0"
      PORT: "8080"
    command: sh -c "npm i -g bun@1 && rm -f package-lock.json && bun install && bun run build && NODE_OPTIONS= node .output/server/index.mjs"
