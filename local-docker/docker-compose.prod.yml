# Modo produção. Se existir uma compilação pronta (baixada do GitHub pelo
# deploy.sh atualizar), apenas inicia em segundos. Senão, compila localmente (lento).
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  app:
    environment:
      NODE_OPTIONS: "--max-old-space-size=5120"
      NITRO_PRESET: "node-server"
      HOST: "0.0.0.0"
      PORT: "8080"
    command: sh -c "if [ -f .output/server/index.mjs ]; then NODE_OPTIONS= exec node .output/server/index.mjs; else npm i -g bun@1 && rm -f package-lock.json && bun install && bun run build && NODE_OPTIONS= exec node .output/server/index.mjs; fi"
